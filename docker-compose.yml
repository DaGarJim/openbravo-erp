services:
  postgres:
    image: postgres:15-alpine
    container_name: openbravo-postgres
    hostname: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=openbravo
      - POSTGRES_USER=tad
      - POSTGRES_PASSWORD=tad
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres:/docker-entrypoint-initdb.d
    networks:
      - openbravo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tad -d openbravo"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
    driver: local

networks:
  openbravo-net:
    driver: bridge
